[package]
name = "tiny-adventurers-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
rmp-serde = "1"
rand = "0.8"
rand_chacha = "0.3"
ts-rs = "10"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# OpenTelemetry (OTLP over HTTP/protobuf): metrics, logs and traces, sent only
# when OTEL_EXPORTER_OTLP_ENDPOINT is set. All Apache-2.0.
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = "0.33"
opentelemetry-appender-tracing = "0.33"
tracing-opentelemetry = "0.34"
# Accounts: PostgreSQL, password hashing, signed session tokens.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json", "migrate", "macros"] }
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
# In-memory metric exporter for the telemetry tests.
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "testing"] }

[profile.release]
opt-level = 3
